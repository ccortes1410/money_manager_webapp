# version: '3.9'

services:
  mysql_db:
    container_name: mysql_db
    image: mysql:8.0
    ports:
      - "3307:3306"
    restart: always
    command: --secure-file-priv=""
    env_file:
      - .env.api
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
      - C:\Users\corte\Desktop\Money Manager\MySQL Uploads:/export
    healthcheck:
      test: ["CMD","mysqladmin", "ping", "-h", "localhost" , "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: money_manager_api
    ports:
      - 3030:3030
    depends_on:
      mysql_db:
        condition: service_healthy
    env_file:
      - .env.api

volumes:
  mysql_data: {}
